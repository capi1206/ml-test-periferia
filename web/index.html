<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Periferia IT - Registro de Proveedores</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --primary: #3b82f6;
      --tool-bg: #111827;
      --accent: #10b981;
      --warning: #f59e0b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 1rem 1.5rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .badge {
      background: #065f46;
      color: #34d399;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message {
      max-width: 80%;
      padding: 1rem;
      border-radius: 0.75rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: var(--primary);
      color: white;
    }
    .assistant {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .tool-box {
      background: var(--tool-bg);
      border-left: 4px solid var(--primary);
      padding: 0.75rem;
      margin-top: 0.5rem;
      border-radius: 0.375rem;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .tool-name { color: #60a5fa; font-weight: bold; }
    .tool-args { color: #9ca3af; }
    .confirmation-alert {
      border: 2px dashed var(--warning);
      background: rgba(245, 158, 11, 0.1);
      padding: 0.75rem;
      border-radius: 0.5rem;
      margin-top: 0.5rem;
      color: var(--warning);
      font-weight: bold;
    }
    #input-form {
      padding: 1rem 1.5rem;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
    }
    input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: white;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      outline: none;
    }
    input:focus { border-color: var(--primary); }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Agente Registro Proveedores · Periferia IT</h1>
    <span class="badge" id="status-badge">Conectando...</span>
  </header>

  <div id="chat-container">
    <div class="message assistant">
      👋 **Hola, soy el agente de registro de proveedores.**
      
Para comenzar, escribe por ejemplo:
`Procesa el caso "ec-corpandina". Dime qué campos quedaron llenos, cuáles faltan y si el paquete está listo para firma.`
    </div>
  </div>

  <form id="input-form">
    <input type="text" id="user-input" placeholder="Escribe tu mensaje o instrucción..." required autocomplete="off" />
    <button type="submit" id="send-btn">Enviar</button>
  </form>

  <script>
    const sessionId = "session-" + Math.random().toString(36).substring(7);
    const chatContainer = document.getElementById("chat-container");
    const inputForm = document.getElementById("input-form");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const statusBadge = document.getElementById("status-badge");

    // Check backend health
    async function checkHealth() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        if (data.ok) {
          statusBadge.textContent = `Modelo: ${data.model}`;
        }
      } catch {
        statusBadge.textContent = "Sin Conexión";
        statusBadge.style.background = "#991b1b";
      }
    }
    checkHealth();

    function appendMessage(role, text) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${role}`;
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    function appendToolCall(toolCall) {
      const toolDiv = document.createElement("div");
      toolDiv.className = "tool-box";
      toolDiv.innerHTML = `
        <div class="tool-name">🛠️ Herramienta: ${toolCall.name}</div>
        <div class="tool-args">Argumentos: ${JSON.stringify(toolCall.args)}</div>
      `;
      chatContainer.appendChild(toolDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    inputForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage("user", message);
      userInput.value = "";
      sendBtn.disabled = true;

      const thinkingMsg = appendMessage("assistant", "Pensando y ejecutando herramientas...");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId, message })
        });

        const data = await res.json();
        chatContainer.removeChild(thinkingMsg);

        if (data.ok) {
          // Render executed tool calls visually
          if (data.toolCalls && data.toolCalls.length > 0) {
            data.toolCalls.forEach(tc => appendToolCall(tc));
          }

          // Render assistant reply
          const replyDiv = appendMessage("assistant", data.reply);

          // Highlight confirmation prompt if needed
          if (data.reply.toLowerCase().includes("confirm") || data.reply.toLowerCase().includes("¿deseas enviar")) {
            const confirmAlert = document.createElement("div");
            confirmAlert.className = "confirmation-alert";
            confirmAlert.textContent = "⚠️ REQUIERE CONFIRMACIÓN HUMANA: Responde 'Sí, envía el paquete' para proceder.";
            chatContainer.appendChild(confirmAlert);
          }
        } else {
          appendMessage("assistant", `❌ Error: ${data.error}`);
        }
      } catch (err) {
        chatContainer.removeChild(thinkingMsg);
        appendMessage("assistant", `❌ Error de red: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    });
  </script>
</body>
</html>
